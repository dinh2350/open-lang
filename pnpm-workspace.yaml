packages:
  - apps/*
  - packages/*
  - e2e

catalog:
  '@types/node': ^24.12.0
  livekit-client: ^2.24.1
  livekit-server-sdk: ^2.19.3
  typescript: ~6.0.3
  vitest: ^5.1.0
  zod: ^4.6.7

onlyBuiltDependencies:
  - '@livekit/rtc-node'
  # Downloads the Prisma schema engine that `prisma migrate` runs.
  - '@prisma/engines'
  - '@swc/core'
  # Uses its prebuilt binary, or compiles one where none ships (Intel Macs).
  - argon2
  - esbuild
  - lefthook
  # Checks the Node version before installing.
  - prisma

# Their install scripts are no-ops (`node -e ""`); they ship prebuilt binaries.
ignoredBuiltDependencies:
  # Their postinstall only prints a nudge to run `astryx init`, which this
  # project must not run against its CLAUDE.md and AGENTS.md.
  - '@astryxdesign/cli'
  - '@astryxdesign/core'
  - '@google/genai'
  - '@livekit/blingfire'
  - '@livekit/local-inference'
  # Optional native speedups for SSH, which Testcontainers doesn't use here,
  # and a version notice.
  - cpu-features
  - protobufjs
  - ssh2
