# Analysis settings for `pnpm sonar` (see docs/quality-gates.md). The
# project key and name come from scripts/sonar/project.ts.

# Every package: the application code of shared, backend, agent and
# frontend, and the test code of each package, e2e included.
sonar.sources=shared/src,backend/src,agent/src,frontend/src
sonar.tests=backend/test,agent/test,frontend/test,e2e

# Generated code and test fixtures are not analyzed. Build output and
# coverage reports sit outside these directories.
sonar.exclusions=**/generated/**
sonar.test.exclusions=e2e/fixtures/**,e2e/node_modules/**,e2e/test-results/**,e2e/playwright-report/**

# Test files never count toward coverage.
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,**/test/**,e2e/**

# The lcov report of each package, written by `pnpm test`.
sonar.javascript.lcov.reportPaths=shared/coverage/lcov.info,backend/coverage/lcov.info,agent/coverage/lcov.info,frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
